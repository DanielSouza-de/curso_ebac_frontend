<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="bem/main.css">
</head>
<body>
    <section class="produtos">
        <article class="produtos__item">
            <img class="produtos__item__image" src="https://placehold.co/100x100" alt="Produto 1">
            <h4 class="produtos__item__name">Nome do produto</h4>
            <p class="produtos__item__description">Descrição do produto</p>
        </article>

        <article class="produtos__item produtos__item--highlight">
            <img class="produtos__item__image" src="https://placehold.co/100x100" alt="Produto em destaque">
            <h4 class="produtos__item__name">Nome do produto</h4>
            <p class="produtos__item__description">Descrição do produto</p>
        </article>

        <article class="produtos__item">
            <img class="produtos__item__image" src="https://placehold.co/100x100" alt="Produto 3">
            <h4 class="produtos__item__name">Nome do produto</h4>
            <p class="produtos__item__description">Descrição do produto</p>
        </article>
    </section>
</body>
</html>
