<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="profile">
        <div class="container">
            <img class="profile__avatar" id="avatar" alt=".">
            <h1 class="profile__name" id="nome"></h1>
            <h2 class="profile__username" id="username"></h2>
            <ul class="numbers">
                <li class="numbers__item">
                    <h4>Repositórios</h4>
                    <span id="repositorios"></span>
                    
                </li>
                <li class="numbers__item">
                    <h4>Seguidores</h4>
                    <span id="seguidores"></span>

                </li>
                <li class="numbers__item">
                    <h4>Seguindo</h4>
                    <span id="seguindo"></span>
                    
                </li>
            </ul>
            <a href="#" class="profile__link" id="link">Ver no Github</a>
        </div>
    </header>
    <script src="./main.js"></script>
</body>
</html>
